<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">CS2 Migrate</title>
  <desc id="description">Move your Counter-Strike 2 setup between Steam accounts safely.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080c18"/><stop offset="1" stop-color="#10182b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#806fff"/><stop offset="1" stop-color="#32d7c8"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#6252f0" stop-opacity=".42"/><stop offset="1" stop-color="#6252f0" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="875" cy="145" r="360" fill="url(#glow)"/>
  <g transform="translate(90 92)">
    <rect width="66" height="66" rx="18" fill="url(#accent)"/>
    <path d="M15 25h27m-8-8 8 8-8 8m17 12H24m8-8-8 8 8 8" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="83" y="42" fill="#f5f7fb" font-family="Segoe UI, sans-serif" font-size="25" font-weight="800" letter-spacing="3">CS2 MIGRATE</text>
  </g>
  <text x="90" y="285" fill="#f5f7fb" font-family="Segoe UI, sans-serif" font-size="78" font-weight="750" letter-spacing="-4">Move your setup.</text>
  <text x="90" y="375" fill="url(#accent)" font-family="Segoe UI, sans-serif" font-size="78" font-weight="750" letter-spacing="-4">Keep your edge.</text>
  <text x="94" y="443" fill="#95a3bb" font-family="Segoe UI, sans-serif" font-size="23">Safe CS2 settings migration for local Steam accounts.</text>
  <g transform="translate(815 215) rotate(-3)">
    <rect width="285" height="220" rx="22" fill="#111827" stroke="#34415d" stroke-width="2"/>
    <circle cx="59" cy="75" r="30" fill="url(#accent)"/>
    <text x="59" y="84" text-anchor="middle" fill="white" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">B</text>
    <rect x="105" y="55" width="115" height="12" rx="6" fill="#e6e9f0"/>
    <rect x="105" y="78" width="79" height="8" rx="4" fill="#59677e"/>
    <path d="M50 144h185" stroke="#293650" stroke-width="2"/>
    <rect x="50" y="166" width="185" height="30" rx="9" fill="#6557ed"/>
  </g>
</svg>
