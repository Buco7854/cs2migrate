<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">CS2 Migrate</title>
  <desc id="description">Copy your Counter-Strike 2 settings to another Steam account on the same PC.</desc>

  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <style>
      .h { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; font-weight: 600; }
      .b { font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#f3f3f3"/>

  <!-- brand -->
  <g transform="translate(80 74)">
    <rect width="44" height="44" rx="10" fill="#0067c0"/>
    <path d="M10 17h15m-5-5 5 5-5 5M34 27H19m5-5-5 5 5 5" fill="none" stroke="#fff" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="29" class="h" font-size="21" fill="#1b1b1b">CS2 Migrate</text>
  </g>

  <!-- headline -->
  <text x="80" y="245" class="h" font-size="52" fill="#1b1b1b">Copy your CS2 settings</text>
  <text x="80" y="308" class="h" font-size="52" fill="#1b1b1b">to another Steam account</text>
  <text x="80" y="362" class="b" font-size="23" fill="#5d5d5d">One Windows executable. No installer.</text>
  <text x="80" y="396" class="b" font-size="23" fill="#5d5d5d">Backs up and verifies every file it replaces.</text>

  <g transform="translate(80 460)">
    <rect width="196" height="42" rx="5" fill="#0067c0"/>
    <text x="98" y="27" class="b" font-size="16" font-weight="600" fill="#fff" text-anchor="middle">Download for Windows</text>
    <text x="216" y="27" class="b" font-size="16" fill="#767676">buco7854.github.io/cs2migrate</text>
  </g>

  <!-- window mock -->
  <g transform="translate(742 132)" filter="url(#cardShadow)">
    <rect width="378" height="366" rx="10" fill="#f3f3f3" stroke="#e5e5e5"/>
    <rect width="378" height="34" rx="10" fill="#f6f6f6"/>
    <rect y="24" width="378" height="10" fill="#f6f6f6"/>
    <path d="M0 34h378" stroke="#e5e5e5"/>
    <text x="14" y="22" class="b" font-size="12" fill="#5d5d5d">CS2 Migrate</text>

    <g transform="translate(14 48)">
      <rect width="350" height="46" rx="6" fill="#dff6dd" stroke="#c6e6c4"/>
      <path d="M16 24l6 6 11-13" fill="none" stroke="#0f7b0f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="21" class="b" font-size="12" font-weight="600" fill="#1b1b1b">Files are safe to copy</text>
      <text x="44" y="36" class="b" font-size="11" fill="#5d5d5d">Steam and CS2 are closed.</text>
    </g>

    <g transform="translate(14 106)">
      <rect width="350" height="106" rx="6" fill="#fff" stroke="#e5e5e5"/>
      <text x="14" y="24" class="b" font-size="12" font-weight="600" fill="#1b1b1b">Accounts</text>
      <text x="14" y="46" class="b" font-size="10" fill="#5d5d5d">Copy from</text>
      <rect x="14" y="54" width="146" height="36" rx="4" fill="#f6f6f6" stroke="#d4d4d4"/>
      <circle cx="33" cy="72" r="11" fill="#0f6cbd"/>
      <text x="33" y="76" class="b" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">B</text>
      <text x="50" y="69" class="b" font-size="11" fill="#1b1b1b">blueentry</text>
      <text x="50" y="82" class="b" font-size="9" fill="#5d5d5d">buco · 39734273</text>
      <text x="175" y="77" class="b" font-size="14" fill="#5d5d5d">⇄</text>
      <text x="204" y="46" class="b" font-size="10" fill="#5d5d5d">Copy to</text>
      <rect x="204" y="54" width="146" height="36" rx="4" fill="#f6f6f6" stroke="#d4d4d4"/>
      <circle cx="223" cy="72" r="11" fill="#5c2e91"/>
      <text x="223" y="76" class="b" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">K</text>
      <text x="240" y="69" class="b" font-size="11" fill="#1b1b1b">kz enjoyer</text>
      <text x="240" y="82" class="b" font-size="9" fill="#5d5d5d">altaccount · 80421061</text>
    </g>

    <g transform="translate(14 224)">
      <rect width="350" height="76" rx="6" fill="#fff" stroke="#e5e5e5"/>
      <text x="14" y="24" class="b" font-size="12" font-weight="600" fill="#1b1b1b">Settings to copy</text>
      <g>
        <rect x="14" y="36" width="160" height="26" rx="4" fill="#f6f6f6" stroke="#d4d4d4"/>
        <rect x="24" y="43" width="12" height="12" rx="3" fill="#0067c0"/>
        <path d="M27 49l2.5 2.5L34 46.5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="44" y="53" class="b" font-size="11" fill="#1b1b1b">Gameplay</text>
      </g>
      <g>
        <rect x="190" y="36" width="160" height="26" rx="4" fill="#f6f6f6" stroke="#d4d4d4"/>
        <rect x="200" y="43" width="12" height="12" rx="3" fill="#0067c0"/>
        <path d="M203 49l2.5 2.5 4.5-5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="220" y="53" class="b" font-size="11" fill="#1b1b1b">Keybinds</text>
      </g>
    </g>

    <g transform="translate(14 312)">
      <rect width="350" height="40" rx="6" fill="#fff" stroke="#e5e5e5"/>
      <text x="14" y="25" class="b" font-size="11" fill="#5d5d5d">4 files · 2 replaced · 2 new</text>
      <rect x="224" y="8" width="112" height="24" rx="4" fill="#0067c0"/>
      <text x="280" y="24" class="b" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Migrate settings</text>
    </g>
  </g>
</svg>
